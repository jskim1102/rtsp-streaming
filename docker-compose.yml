# rtsp-streaming — standalone 3컨테이너(backend + frontend + mediamtx)
#
# 설치·실행: Linux·macOS는 ./setup.sh, Windows는 setup.cmd
# 종료:   docker compose down
#
# 환경변수: 같은 디렉토리의 `.env` 를 compose 가 자동으로 읽어 ${VAR} 로 치환.
#          setup이 .env.example로 .env를 생성한다.
# 브라우저 접속: https://<서버IP>:${FRONTEND_PORT}  (frontend 프록시가 화면·API·영상 신호의 단일 입구)

name: rtsp-streaming

# 컨테이너 로그 상한 — 서비스당 20MB × 5개, 넘치면 오래된 파일부터 지운다.
# 상한이 없으면 로그가 디스크를 채워 DB 쓰기와 같은 서버의 다른 서비스까지 멈춘다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ─────────────────────────────── Backend ───────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: rtsp-streaming-backend
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # SQLite DB 를 named volume 으로 — database.py 기본 경로 대신 override (spec Decision).
      DATABASE_URL: sqlite:////app/data/ipcam.db
      # config.py 가 읽는 등록 cap. 비우면 config 기본 16.
      MAX_IPCAMS: ${MAX_IPCAMS:-16}
      # standalone mediamtx API. 별도 인스턴스를 쓸 때만 .env 로 override.
      MEDIAMTX_API: ${MEDIAMTX_API:-http://mediamtx:9997}
      # path 네임스페이스 prefix — stream_key 가 `rtsp_streaming__ipcam-*` 로 생성(프로젝트간 교차열람 차단).
      MEDIAMTX_PATH_PREFIX: ${MEDIAMTX_PATH_PREFIX:-rtsp_streaming}
      # mediamtx 인증 — backend user. 경로 등록·조회 API 만 쓴다.
      MEDIAMTX_BACKEND_USER: ${MEDIAMTX_BACKEND_USER:-backend}
      MEDIAMTX_BACKEND_PASS: ${MEDIAMTX_BACKEND_PASS:?set MEDIAMTX_BACKEND_PASS in .env}
    # 포트를 호스트에 공개하지 않는다 — frontend 프록시가 /api 만 넘기고, 훅 알림 주소(/internal)는 밖에서 닿지 않는다.
    # BACKEND_PORT 는 dev.sh 가 호스트에서 백엔드를 띄울 때만 쓴다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    volumes:
      # SQLite DB 영속화 — named volume (원본 bind-mount `touch deepeye.db` 트랩 회피).
      - ipcam_db:/app/data
    networks:
      - rtsp-streaming
    depends_on:
      - mediamtx
    logging: *default-logging
    restart: unless-stopped

  # ─────────────────────────────── Frontend ──────────────────────────────
  frontend:
    # 빌드에는 포트·자격증명을 넣지 않는다 — 넣은 값은 화면 번들에 그대로 남는다 (아래 environment 로 실행 때 받음).
    build:
      context: ./frontend
    image: rtsp-streaming-frontend:dev
    pull_policy: build
    container_name: rtsp-streaming-frontend
    environment:
      # 프록시가 실행할 때 읽는 값 — 이미지와 화면 번들에는 넣지 않는다.
      # WHEP 경로 규칙(<접두사>__ipcam-)과 viewer 자격증명(프록시가 WHEP 요청에 붙임)에 쓴다.
      MEDIAMTX_PATH_PREFIX: ${MEDIAMTX_PATH_PREFIX:-rtsp_streaming}
      MEDIAMTX_VIEWER_USER: ${MEDIAMTX_VIEWER_USER:-viewer_rtsp_streaming}
      MEDIAMTX_VIEWER_PASS: ${MEDIAMTX_VIEWER_PASS:?set MEDIAMTX_VIEWER_PASS in .env}
      # 자체 서명 인증서에 넣을 주소. 비우면 localhost·127.0.0.1 만 넣는다.
      MEDIAMTX_WEBRTC_HOST: ${MEDIAMTX_WEBRTC_HOST:-}
    ports:
      # 호스트 ${FRONTEND_PORT} → 컨테이너 443 (HTTPS + HTTP/2). 같은 포트로 온 http:// 는 https:// 로 넘긴다.
      - "${FRONTEND_PORT:?set FRONTEND_PORT in .env}:443"
    volumes:
      # 인증서 폴더 — 운영자 인증서(server.crt·server.key)를 넣거나, 없으면 자체 서명 인증서가 여기 남아 업데이트 뒤에도 유지된다.
      - ./certs:/etc/nginx/certs
    networks:
      - rtsp-streaming
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  # ─────────────────────────────── MediaMTX ──────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:1.19.1-ffmpeg
    container_name: rtsp-streaming-mediamtx
    environment:
      # 시청 브라우저가 접속할 주소. 비워 두면 같은 PC의 게시된 ICE 포트를 사용한다.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_HOST:-127.0.0.1}
      MTX_WEBRTCLOCALUDPADDRESS: ":${MEDIAMTX_ICE_UDP_PORT:?set MEDIAMTX_ICE_UDP_PORT in .env}"
      # UDP 가 막힌 외부망(회사/카페 방화벽, 라우터 UDP 포워딩 불가)용 ICE TCP fallback — 같은 포트의 tcp.
      MTX_WEBRTCLOCALTCPADDRESS: ":${MEDIAMTX_ICE_UDP_PORT:?set MEDIAMTX_ICE_UDP_PORT in .env}"
      # mediamtx.yml authInternalUsers 순서와 강결합: 1=backend, 2=viewer_rtsp_streaming.
      MTX_AUTHINTERNALUSERS_1_USER: ${MEDIAMTX_BACKEND_USER:-backend}
      MTX_AUTHINTERNALUSERS_1_PASS: ${MEDIAMTX_BACKEND_PASS:?set MEDIAMTX_BACKEND_PASS in .env}
      MTX_AUTHINTERNALUSERS_2_USER: ${MEDIAMTX_VIEWER_USER:-viewer_rtsp_streaming}
      MTX_AUTHINTERNALUSERS_2_PASS: ${MEDIAMTX_VIEWER_PASS:?set MEDIAMTX_VIEWER_PASS in .env}
      # path prefix override 도 viewer 권한 경계에 함께 반영한다.
      # viewer 권한 칸(mediamtx.yml)이 read 하나라 0번만 덮어쓴다 — 없는 칸을 가리키면 빈 권한 칸이 생긴다.
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_PATH: "~^${MEDIAMTX_PATH_PREFIX:-rtsp_streaming}__"
    ports:
      # API 는 backend control plane 용이라 host loopback 에만 노출한다.
      - "127.0.0.1:${MEDIAMTX_API_PORT:?set MEDIAMTX_API_PORT in .env}:9997"
      - "${MEDIAMTX_RTSP_PORT:?set MEDIAMTX_RTSP_PORT in .env}:8554"
      # WebRTC 신호(WHEP)는 frontend 프록시가 내부망으로 넘긴다 — 호스트에는 이 PC 에만 연다 (dev.sh 의 개발 서버용).
      - "127.0.0.1:${MEDIAMTX_WEBRTC_PORT:?set MEDIAMTX_WEBRTC_PORT in .env}:8889/tcp"
      - "${MEDIAMTX_ICE_UDP_PORT:?set MEDIAMTX_ICE_UDP_PORT in .env}:${MEDIAMTX_ICE_UDP_PORT:?set MEDIAMTX_ICE_UDP_PORT in .env}/udp"
      - "${MEDIAMTX_ICE_UDP_PORT:?set MEDIAMTX_ICE_UDP_PORT in .env}:${MEDIAMTX_ICE_UDP_PORT:?set MEDIAMTX_ICE_UDP_PORT in .env}/tcp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - rtsp-streaming
    logging: *default-logging
    restart: unless-stopped

networks:
  # Compose 가 프로젝트별 내부망을 자체 생성한다. 외부 harness 인프라가 필요 없다.
  rtsp-streaming:

volumes:
  ipcam_db:
